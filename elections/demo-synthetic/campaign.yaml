# Who funds, supports, and opposes each measure. Shown next to the text analysis,
# never sent to a model. Every row cites a source below.
#
# committees:    the campaign committees formed for or against the measure
# contributions: money given to one of those committees (from -> to)
# endorsements:  public statements of support or opposition
# side: support | oppose (the measure). A contribution takes the side of the committee it went to.
